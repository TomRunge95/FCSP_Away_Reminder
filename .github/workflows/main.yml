name: Ticket Reminder Bot

on:
  schedule:
    - cron: '17 6,12 * * *'  # zwei lange Tagesbloecke; das Skript pollt darin alle 5 Minuten
  workflow_dispatch:

concurrency:
  group: ticket-reminder-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-r-script:
    runs-on: ubuntu-latest
    timeout-minutes: 390

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Enable r2u binary repo
        run: |
          sudo bash -c 'echo "deb [signed-by=/usr/share/keyrings/cran-archive-keyring.gpg] \
          https://r2u.rstudio.com/ubuntu jammy/main/" > /etc/apt/sources.list.d/cran-r2u.list'
          curl -fsSL https://r2u.rstudio.com/ubuntu/cran-archive-keyring.gpg | \
            sudo tee /usr/share/keyrings/cran-archive-keyring.gpg > /dev/null
          sudo apt-get update

      - name: Install R and required R packages
        run: |
          sudo apt-get install -y --no-install-recommends \
            r-base \
            r-cran-dplyr \
            r-cran-lubridate \
            r-cran-httr \
            r-cran-rvest \
            r-cran-stringr

      - name: Run Ticket Reminder
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          run_bot_and_persist_status() {
            git pull --rebase origin main
            Rscript Mett_Bot.R
            git add reminder_status.rds
            if git diff --cached --quiet; then
              return 0
            fi
            
            git commit -m "Update reminder status"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                return 0
              fi
              
              git rebase --abort || true
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep 10
            done
          }
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_bot_and_persist_status
            exit 0
          fi
          
          now_epoch=$(date -u +%s)
          midday_epoch=$(date -u -d '12:00:00' +%s)
          if [ "$now_epoch" -lt "$midday_epoch" ]; then
            deadline_epoch=$(date -u -d '13:05:00' +%s)
          else
            deadline_epoch=$(date -u -d '19:05:00' +%s)
          fi
          
          while true; do
            run_bot_and_persist_status
            now_epoch=$(date -u +%s)
            if [ "$now_epoch" -ge "$deadline_epoch" ]; then
              break
            fi
            
            sleep_seconds=$((300 - (now_epoch % 300)))
            if [ "$sleep_seconds" -lt 30 ]; then
              sleep_seconds=$((sleep_seconds + 300))
            fi
            sleep "$sleep_seconds"
          done
